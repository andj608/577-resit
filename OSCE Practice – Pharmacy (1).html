<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>OSCE Practice – Pharmacy</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1f2328;--mu:#667;--ac:#0f766e;--bd:#ddd;--warn:#fff4e0;--wt:#8a5a00;--red:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15181a;--card:#1f2326;--tx:#e8eaec;--mu:#9aa;--ac:#2dd4bf;--bd:#333;--warn:#3a2d12;--wt:#f5c56b;--red:#ff6b6b}}
*{box-sizing:border-box}html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header select{flex:1 1 220px;min-width:0}
main{max-width:820px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
button,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.warn{background:var(--warn);color:var(--wt);padding:6px 10px;border-radius:8px;margin-bottom:10px;font-weight:600}
.mu{color:var(--mu);font-size:13px}
h2{margin:2px 0 10px;font-size:20px}h3{margin:0 0 8px;font-size:16px;color:var(--ac)}
label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer}
input[type=checkbox]{margin-top:5px;accent-color:var(--ac)}
.clue{border-left:3px solid var(--ac);padding:3px 10px;margin:8px 0}
.score{font-size:22px;font-weight:700;color:var(--ac)}
#timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;min-width:52px}
#timer.low{color:var(--red)}
.tag{font-size:12px;font-weight:600;background:var(--warn);color:var(--wt);padding:2px 8px;border-radius:10px;vertical-align:middle;white-space:nowrap}
.nav{display:flex;gap:8px;justify-content:space-between}
</style></head><body>
<header><select id="sel"></select><span id="timer">7:00</span>
<button id="ts">Start</button><button id="tr">Reset</button></header>
<main id="m"></main>
<script>
const G={1:"Station 1 · New Medicine Counselling",2:"Station 2 · Patient Concern",3:"Station 3 · OTC & Triage"};
// [station, title, pharmacist scenario, patient role, clues "asked about|patient reveals", checklist]
const D=[
[1,"Isotretinoin (Oratane) – severe acne","You are a community pharmacist. A 24-year-old woman presents a new prescription for isotretinoin 20 mg for severe acne. Counsel her on this new medicine.","24-year-old woman, anxious. Opening: “The dermatologist gave me this for my acne. How do I take it?”",["Pregnancy, contraception or sexual activity|You are sexually active and use no contraception.","Other medicines|You still take doxycycline from your GP.","Mood|You have felt low lately and get bad headaches.","Contact lenses, waxing, blood donation|You wear contact lenses, have waxing booked, and donate blood."],["Confirms what she knows; purpose (severe acne)","Take whole with a fatty main meal","Teratogenic: 2 reliable contraceptives from 1 month before to 1 month after; monthly pregnancy test","No blood donation during and 1 month after","Initial flare 2–4 weeks; course 6–12 months","Dry lips, eyes, skin: lip balm, moisturiser, eye drops; no contact lenses","SPF 50+; no waxing, laser or dermabrasion for 6 months after","Red flags: severe headache, blurred vision, tinnitus, low mood or suicidal thoughts","No doxycycline together (benign intracranial hypertension)","Teach-back"]],
[1,"Doxycycline – rosacea / moderate acne","You are the pharmacist. A 35-year-old woman is newly prescribed doxycycline 50 mg daily for rosacea. Counsel her.","35-year-old woman. Opening: “What do I need to know about this antibiotic?” You take it with milk in the morning and lie down after.",["How she takes tablets|You take it with a little milk, then go back to bed.","Other supplements|You take iron and calcium tablets in the morning.","Pregnancy plans|You are trying for a baby.","Sun exposure|You garden daily without sunscreen."],["Purpose: anti-inflammatory for rosacea","With food and a full glass of water; upright 30 minutes (oesophageal ulcer)","Separate from antacids, iron, calcium, magnesium, zinc, dairy by at least 2 hours","Photosensitivity: sunscreen and cover up","Not in pregnancy, breastfeeding or under 8 years; discuss plans","Never with isotretinoin","50 mg tablet: do not halve a 100 mg tablet (alternate-day 100 mg)","Teach-back"]],
[1,"Methotrexate – rheumatoid arthritis","You are the pharmacist. A 58-year-old man is newly prescribed methotrexate 2.5 mg tablets (Trexate) for rheumatoid arthritis. Counsel him.","58-year-old man. Opening: “My rheumatologist started this. What do I need to know?”",["Other medicines|You take ibuprofen most days for joint pain.","Recent infections or antibiotics|The GP offered co-trimoxazole for a UTI.","Alcohol|You drink about 3 beers every night.","Family planning|You and your wife hope for another baby."],["Purpose: slows joint damage","ONCE A WEEK on a fixed day, never daily; write it down","Missed dose: take within 24 hours, else skip","Folic acid (about 5 mg weekly) on a different day","Red flags: sore throat, mouth ulcers, bruising; jaundice, dark urine; dry cough, breathlessness","No trimethoprim/co-trimoxazole; avoid OTC NSAIDs; limit alcohol","Contraception: men 3 months, women 3–6 months after stopping","Regular blood tests; teach-back"]],
[1,"Alendronate – osteoporosis","You are the pharmacist. A 70-year-old woman is newly prescribed alendronate 70 mg weekly for osteoporosis. Counsel her.","70-year-old woman. Opening: “They said I have thin bones. How do I take these?”",["Morning routine|You take tablets with tea after breakfast, then lie down to rest.","Stomach problems|You get heartburn often.","Dental history|You need a tooth extraction next month.","Supplements|You take calcium with breakfast."],["Purpose: stronger bones, fewer fractures","On waking, empty stomach, full glass of plain water, swallow whole","Upright (sit/stand) at least 30 minutes","No food, drink or other medicines (calcium) for 30 minutes","Red flags: painful swallowing, new or worse heartburn","Thigh/groin pain (atypical fracture); jaw pain, loose teeth (ONJ); red painful eyes","Dental check before starting","Teach-back"]],
[1,"Empagliflozin (Jardiance) – type 2 diabetes","You are the pharmacist. A 62-year-old man with type 2 diabetes and heart failure starts empagliflozin. Counsel him.","62-year-old man. Opening: “Will this just lower my sugar?” You often skip meals and get unwell with stomach bugs.",["Illness history|You often get vomiting and diarrhoea.","Genital symptoms|Occasional itching in the groin.","Other medicines|Metformin and a water tablet."],["Purpose: lowers glucose; heart and kidney protection","Sick Day Rule: pause when vomiting, diarrhoea, dehydrated or before surgery","Euglycaemic DKA: nausea, abdominal pain, fast breathing; check ketones even if glucose normal","Genital thrush; perineal necrotising fasciitis warning","Hydration; teach-back"]],
[1,"Levothyroxine – hypothyroidism","You are the pharmacist. A 38-year-old woman starts levothyroxine. Counsel her.","38-year-old woman. Opening: “When should I take this?” You have a coffee and calcium with breakfast.",["Morning routine|You take it with coffee and breakfast and calcium tablets.","Brand|You may change to a cheaper brand."],["Purpose","Daily, empty stomach: 1 hour before breakfast or 3 hours after dinner","Separate 4 hours from calcium, iron, antacids, sucralfate","Do not switch brand without advice (narrow therapeutic index)","TSH after 4–6 weeks","Teach-back"]],
[1,"H. pylori triple therapy","You are the pharmacist. A 45-year-old man receives omeprazole, amoxicillin and clarithromycin for H. pylori. Counsel him.","45-year-old man. Opening: “How long do I take all these?” You plan to stop once you feel better.",["Allergy|You had a rash on penicillin once.","Plans|You will stop after a week if you feel fine.","Taste|You hate metallic tastes."],["Purpose","Full 14 days; do not stop early","Check penicillin allergy","Metallic taste is common","Retest after 6–8 weeks; stop PPI 2 weeks before stool antigen (famotidine ok)","Teach-back"]],
[1,"Gabapentin/pregabalin/amitriptyline – neuropathic pain","You are the pharmacist. A 60-year-old man starts a neuropathic pain medicine. Counsel him.","60-year-old man. Opening: “Will this fix my pain tonight?” You drive for work and drink at weekends.",["Driving|You drive a truck for work.","Alcohol|You drink at weekends.","Expectation|You expect instant relief."],["Purpose: nerve pain","Slow titration; 6–8 weeks for full effect","Take at bedtime","Safe to drive advice; no alcohol","Teach-back"]],
[2,"Methotrexate taken daily by mistake","A 65-year-old man collects methotrexate 2.5 mg and says he feels unwell. You are the pharmacist. Address his concern.","65-year-old man. Opening: “I feel awful, my mouth is sore.” You took 1 tablet EVERY DAY for 5 days.",["How and when he takes it|One tablet every day for 5 days.","Mouth, throat, fever|Mouth ulcers, sore throat, mild fever.","Bruising, cough, urine|Unusual bruising, dry cough, dark urine.","Other medicines|Ibuprofen and co-trimoxazole."],["Empathy","Stop methotrexate immediately","Days and strength (2.5 vs 10 mg)","Screens for toxicity","Checks NSAID/trimethoprim","Same-day review; FBC, LFT, renal; ED if symptomatic","Fixed weekday on label; teach-back"]],
[2,"Stopping long-term omeprazole","A 50-year-old woman on omeprazole for 2 years wants to stop it. You are the pharmacist. Address her concern.","50-year-old woman. Opening: “I want to stop this, I hate taking tablets.”",["Reason|You read PPIs are bad for you.","Alarm symptoms|No swallowing trouble, no weight loss, no black stools.","Original reason|You started for reflux."],["Empathy","Over 8 weeks use: stopping suddenly causes rebound acid","Step down: half dose or alternate days for 2–4 weeks","Screens ALARM symptoms","Lifestyle measures; reviews need","Teach-back"]],
[2,"Black stools after NSAID","A 60-year-old woman on naproxen for knee pain asks for iron because she feels tired and has dark stools. You are the pharmacist. Address her concern.","60-year-old woman. Opening: “I am so tired and my poo is black. Is it the iron?” You have not taken iron.",["Iron|You have not started iron.","Stools|Tarry, sticky black stools for 3 days; no stomach pain.","NSAID use|Naproxen twice daily for 3 weeks and aspirin.","Dizziness|Light-headed on standing."],["Empathy","Identifies melaena as upper GI bleed red flag","Stop NSAID","Same-day ED or doctor","Does not sell iron or acid reducer","Asks about alcohol, anticoagulants","Teach-back"]],
[2,"Stopping adapalene/benzoyl peroxide","A 19-year-old wants to stop her acne gel after 2 weeks because of peeling and new spots. You are the pharmacist. Address her concern.","19-year-old woman. Opening: “My face is peeling and I have more spots. I want to stop.”",["How she applies it|Applied thickly to wet skin straight after washing.","Moisturiser and sunscreen|Not using either.","Pregnancy|You are trying to get pregnant."],["Empathy","Purge/adaptation 2–4 weeks; benefit 4–6 weeks, best at 12","Wait 20–30 minutes after washing","Pea-sized amount for whole face","Oil-free moisturiser and sunscreen","Adapalene unsuitable in pregnancy","Teach-back"]],
[2,"Doxycycline with isotretinoin","A 20-year-old woman collects isotretinoin and asks for her usual doxycycline. You are the pharmacist. Address the concern.","20-year-old woman. Opening: “Can I get my usual doxycycline as well?” You have headaches.",["Headaches/vision|Daily headaches, blurred vision, tinnitus.","Contraception|Pill only, sometimes missed.","Sun|You burn easily."],["Empathy","Identifies the combination","Benign intracranial hypertension risk","Stop doxycycline; about 7 days before isotretinoin","Urgent review for headache/visual symptoms","Contraception and monthly tests","Teach-back"]],
[2,"Diabetes sick day","A 55-year-old man with type 2 diabetes has vomited and had diarrhoea for 2 days. You are the pharmacist. Address his concern.","55-year-old man. Opening: “I cannot keep food down. Should I take my diabetes tablets?”",["Medicines|Metformin, empagliflozin, Lantus.","Symptoms|Abdominal pain, nausea, fast breathing; glucose 8.","Intake|Barely drinking.","Genital symptoms|Groin soreness."],["Empathy","Pause metformin and empagliflozin","Reasons: lactic acidosis; dehydration/DKA","Do not stop long-acting insulin","Check glucose every 2–4 hours; fluids","Check ketones even if glucose normal","Urgent care if symptomatic","Restart when eating and drinking","Teach-back"]],
[2,"Elderly dizziness and falls (FRIDs)","A 80-year-old woman keeps falling and feels dizzy. Her daughter collects the prescriptions. You are the pharmacist. Address the concern.","Daughter of the patient. Opening: “Mum fell again. Could her tablets be causing it?”",["Medicine list|Zopiclone, amitriptyline, amlodipine and furosemide.","Pattern|Dizzy on standing at night.","Mood|Takes amitriptyline for pain."],["Empathy","Identifies FRIDs: sedatives, TCA, antihypertensive, diuretic","Orthostatic hypotension, sedation, anticholinergic burden","Do not stop zopiclone suddenly; taper with doctor","Suggest nortriptyline (less anticholinergic)","Rise slowly; home falls prevention","Teach-back"]],
[3,"Child with sores (impetigo)","A mother asks for something for her 6-year-old’s sores around his mouth. You are the pharmacist. Use WWHAM and decide treatment or referral.","Mother of a 6-year-old. Opening: “My son has crusty sores on his face.”",["Number of sores|Only 2 small crusted sores.","Fever|No fever; child well.","Blisters|No large blisters.","School and household|Goes to school; shares towels with sister."],["WWHAM","Red flags: over 3 lesions, bullous, fever → GP flucloxacillin","Hydrogen peroxide 1% or povidone-iodine 10%, 2–3 times daily for 5 days","Fusidic acid not first line","Clean, cut nails, cover","Out of school 24 hours after treatment","Separate towels; wash linen","Safety-net"]],
[3,"Scabies","A 30-year-old man asks for something for severe night-time itch. You are the pharmacist. Use WWHAM and advise.","30-year-old man. Opening: “I itch all night, especially my hands.”",["Household|Partner and two kids also itch.","Skin|Burrows between fingers; no pus or crusts.","Treatments|Hydrocortisone did not help."],["WWHAM","Excludes crusted scabies or infection → GP","Permethrin 5% whole body including scalp, face, neck, ears; webs and nails","Leave 8–12 hours; reapply to washed hands","Repeat in 7–10 days","Treat whole household same day","Itch may persist weeks; crotamiton or 1% hydrocortisone","Teach-back"]],
[3,"Acne vulgaris – OTC","A 17-year-old asks for something for pimples on her face. You are the pharmacist. Use WWHAM and advise.","17-year-old girl with a parent. Opening: “I want something for my acne.”",["Severity|Mostly blackheads and small spots, a few cysts.","Treatments tried|Face wash only for 3 months.","Pregnancy|Not pregnant; no plan."],["WWHAM","Refer: cysts/nodules, scarring, distress, no response after 3 months","Benzoyl peroxide 2.5–5% or hydrogen peroxide 1% on whole area; warn bleaching","Azelaic acid 20% BD","Adapalene 0.1% at night (pharmacist only; avoid in pregnancy; sunscreen)","Moisturiser and sunscreen","Teach-back"]],
[3,"Eczema (atopic dermatitis)","A mother asks for help with her 4-year-old’s itchy dry rashes. You are the pharmacist. Use WWHAM and advise.","Mother of a 4-year-old. Opening: “My daughter’s skin is red and itchy.”",["Infection signs|Some oozing yellow patches.","Eye area / blisters|Clustered painful blisters near the eye.","Current care|Uses scented bubble bath."],["WWHAM","Red flag: infection or eczema herpeticum → same-day emergency","Emollient 2+ times daily, in direction of hair; use a clean spoon","Soap substitute (sorbolene)","Hydrocortisone 1% short term, no more than 7 days","Safety-net"]],
[3,"Dandruff / seborrhoeic dermatitis","A 28-year-old man asks for something for flaky scalp and red skin beside his nose. You are the pharmacist. Use WWHAM and advise.","28-year-old man. Opening: “I have flakes on my scalp and my face is red.”",["Duration|On and off for years.","Treatments tried|Regular shampoo only.","Symptoms|Itchy, no pus."],["WWHAM","Ketoconazole shampoo; leave a few minutes then rinse","Can use on face/body as wash","Soap-free gentle cleanser","When to see GP","Teach-back"]],
[3,"Dyspepsia / GORD","A 45-year-old man asks for heartburn medicine. You are the pharmacist. Use WWHAM and advise.","45-year-old man. Opening: “I get bad heartburn, what do you recommend?”",["Alarm symptoms|None; swallowing fine.","Medicines|Daily ibuprofen for back pain.","Habits|Coffee, alcohol, late meals, smoker."],["WWHAM","ALARM screen (dysphagia, weight loss, melaena, haematemesis, persistent vomiting, new onset over 55)","Review NSAID use","Omeprazole 10–20 mg 30–60 minutes before breakfast for 14 days, or famotidine","No food 3 hours before bed, raise bed head, stop smoking, less coffee/alcohol","GP if persists","Teach-back"]],
[3,"Capsaicin cream – osteoarthritis","A 68-year-old woman asks for capsaicin cream for hand osteoarthritis. You are the pharmacist. Use WWHAM and advise.","68-year-old woman. Opening: “My friend said capsaicin helps joints.”",["Joints|Hands and fingers.","Skin|Intact; you rub your eyes often.","Expectation|You expect instant relief."],["WWHAM","Excludes red flags","Depletes substance P","Apply 4 times daily","1–2 weeks to work; initial burning is normal","Wash hands well (wait 30 min if treating hands)","Avoid eyes, nose, mouth, broken skin","Special Authority in NZ","Teach-back"]],
[3,"Acute gout flare","A 52-year-old man asks for strong pain relief for a hot swollen big toe. You are the pharmacist. Use WWHAM and decide.","52-year-old man. Opening: “My toe is on fire, it must be gout.”",["Kidneys / heart / ulcers|Normal kidneys, no ulcer; no blood thinners.","Current medicines|Allopurinol daily; ran out 2 days ago.","Fever|No fever; single joint."],["WWHAM","Screens renal, CV, ulcer, anticoagulants","Do not stop allopurinol","NSAID if no contraindication: naproxen 750 mg then 500 mg, then 250 mg every 8 hours","Contraindication → GP: prednisone or colchicine (1 mg then 500 mcg after 1 hour; max 1.5 mg; not repeated for 3 days)","See GP for urate-lowering","Teach-back"]],
[1,"Dulaglutide (Trulicity) – type 2 diabetes","You are the pharmacist. A 56-year-old man with type 2 diabetes and a previous stroke is newly prescribed dulaglutide (Trulicity) weekly injection, in addition to metformin and gliclazide. Counsel him.","56-year-old man, nervous about needles. Opening: “The doctor wants me to inject once a week. How does it work?”",["Other diabetes medicines|You take metformin and gliclazide.","Injection experience|You have never injected and are afraid of needles.","Past illnesses and family history|You had gallstones years ago; no pancreatitis; no thyroid cancer in the family.","Storage and travel|You travel a lot and often leave things in the car."],["Confirms understanding; purpose: lowers glucose, protects against stroke/CVD","Once weekly, same day each week","Pen technique and site rotation (abdomen, thigh, upper arm)","Common: nausea, vomiting, diarrhoea; improves with gradual titration","Red flags: severe abdominal pain to the back (pancreatitis), gallbladder pain","Not suitable with medullary thyroid cancer family history or gastroparesis","Hypoglycaemia risk with gliclazide; do not combine with DPP-4 inhibitor","Storage: fridge, avoid heat","Teach-back"],"★ Appeared in exam"],
[1,"Allopurinol – gout prevention","You are the pharmacist. A 55-year-old man with recurrent gout is newly prescribed allopurinol. Counsel him.","55-year-old man. Opening: “Why do I need a daily tablet when my toe feels fine now?”",["Kidney function|Your eGFR is about 50.","Other medicines|You take a thiazide diuretic for blood pressure and azathioprine.","His plan|You plan to stop it once the flare settles.","Rash history|No rash so far."],["Purpose: lowers uric acid long term; target below 0.36 mmol/L (0.30 if severe)","Lifelong; keep taking during flares","Start low, go slow: eGFR 30–60 start 50 mg; titrate every 4 weeks","May trigger flares early: prophylaxis (naproxen 250 mg BD or colchicine 500 mcg BD) for 3–6 months","Any rash, itch or fever: stop and seek help urgently (DRESS/SJS/TEN)","Higher risk: high start dose, kidney disease, thiazide, HLA-B*5801","Never with azathioprine or 6-MP","Fluids, limit alcohol; teach-back"],"★ Appeared in exam"],
[1,"Metformin – type 2 diabetes","You are the pharmacist. A 52-year-old woman with newly diagnosed type 2 diabetes is started on metformin. Counsel her.","52-year-old woman. Opening: “What does this tablet do?”",["Kidney function|eGFR is 40.","Illness|You often get vomiting bugs.","Procedures|You have a CT scan with contrast next week.","Pregnancy plans|You hope to become pregnant."],["Purpose: reduces liver glucose production, improves insulin sensitivity","Take with or after meals; slow dose increase","Dose limits by eGFR (30–45 max 1 g/day)","Nausea, diarrhoea; B12 deficiency (yearly check)","Pause with vomiting, diarrhoea, surgery or contrast (lactic acidosis)","Safe in pregnancy; low hypoglycaemia risk alone","Lifestyle, weight loss; teach-back"]],
[1,"Insulin pen – type 1 diabetes","You are the pharmacist. A 24-year-old man with type 1 diabetes starts basal and rapid-acting insulin pens. Counsel him.","24-year-old man. Opening: “How do I use these pens?” You work as a delivery driver.",["Needle use|You reuse needles for a week to save money.","Injection sites|You always inject in the same spot.","Driving|You drive for work and drive when your sugar feels okay.","Sick days|When unwell and not eating you stop insulin."],["Basal vs bolus; rapid-acting with meals, glargine once daily","New 4–5 mm needle each time; prime 2 units; rotate sites (lipohypertrophy)","Hypoglycaemia under 4.0: 15 g (under 70 kg) or 30 g (over 70 kg) fast sugar, retest in 15 min, then snack","Driving: glucose at least 5.0 before driving; wait 1 hour after treating a low","Sick day: never stop basal insulin; check ketones (over 1.5 mmol/L urgent)","Glucagon (GlucaGen HypoKit) at home","Teach-back"]],
[1,"Semaglutide (Wegovy) – weight management","You are the pharmacist. A 40-year-old woman (BMI 34) is newly prescribed semaglutide (Wegovy) weekly injection. Counsel her.","40-year-old woman. Opening: “How quickly will this work?”",["Contraception|You use the oral contraceptive pill.","Upcoming procedures|You have a gastroscopy next month.","Other medicines|You also take warfarin.","Pregnancy plans|You may try for a baby in a few months."],["Purpose with diet, exercise and strength training","Weekly; titrate over 16 weeks to 2.4 mg","Nausea, vomiting, constipation; pancreatitis and gallbladder warnings","Delayed gastric emptying: warfarin, digoxin, oral contraceptive absorption (non-oral contraception during titration)","Stop before anaesthesia/endoscopy (1 day to 1 week)","Stop at least 2 months before conception (long half-life, 5 weeks to clear)","With insulin/SU reduce dose about 20%","Weight regain after stopping; teach-back"]],
[2,"Steroid cream worry – child eczema","A mother is reluctant to use the topical steroid prescribed for her 4-year-old’s eczema. You are the pharmacist. Address her concern.","Mother of a 4-year-old. Opening: “I do not want to put steroids on my child. Can I just use moisturiser?”",["Reason for worry|You read steroids thin the skin and stunt growth.","Current routine|Moisturiser once daily; long hot baths with bubble bath.","Where she plans to use it|The same strong steroid on her face.","Flares|Rash flares weekly and disturbs sleep."],["Empathy; explores her concern","Reassures: safe and effective when used correctly","Potency by site: mild (hydrocortisone 0.5–1%) for face, neck, folds; stronger for body","Fingertip unit; thin layer on inflamed areas until clear","Emollients at least twice daily (about 1 kg/month); clean spoon","Short warm baths (15 min or less), soap-free wash","Weekend maintenance 2 times a week","Risks mainly from overuse; see GP if infected or not improving","Teach-back"],"★ Appeared in exam"],
[2,"Steroid lotion worry – psoriasis","A 45-year-old woman with psoriasis is worried about the steroid in her calcipotriol/betamethasone lotion and wants to stop. You are the pharmacist. Address her concern.","45-year-old woman. Opening: “I read steroids are dangerous. I want to stop this lotion.”",["Her fear|You read it thins skin and causes rebound.","Areas|You apply it to your face and groin as well.","Duration|You use it daily non-stop for 3 months.","Other products|You also use a salicylic acid scalp product."],["Empathy; explores concern","Safe when used as directed; short courses","Steroid: up to 4 weeks continuous then 4 weeks break; avoid over 10% BSA with potent steroids","Calcipotriol: max 100 g/week; under 30% BSA; not on face","Salicylic acid and UV inactivate calcipotriol","Emollients; avoid triggers","GP review if not controlled; teach-back"],"Practised in class"],
[2,"Rash and fever after allopurinol","A 60-year-old man started allopurinol 3 weeks ago and now has a rash and fever. You are the pharmacist. Address his concern.","60-year-old man. Opening: “I have a rash all over and feel feverish.”",["Dose and duration|Allopurinol 300 mg for 3 weeks.","Other symptoms|Fever, red sore eyes, mouth ulcers, swollen face.","Other medicines|Hydrochlorothiazide.","Kidney function|You have chronic kidney disease."],["Empathy","Recognises possible SJS/TEN/DRESS","Stop allopurinol immediately","Urgent hospital/ED if fever, mucosal involvement, blisters, face swelling","Never re-challenge; record allergy","Risk factors: high start dose, CKD, thiazide","Teach-back"]],
[2,"Hypoglycaemia while driving","A 28-year-old man with type 1 diabetes tells you he felt shaky while driving and had a low glucose. You are the pharmacist. Address his concern.","28-year-old man, 80 kg. Opening: “I nearly crashed. My sugar was 3.2.”",["Episode|You ate one biscuit and carried on.","Current reading|Your reading is 4.5 and you need to drive home.","Glucagon kit|Your kit at home is expired.","Cause|You skipped lunch after a heavy insulin dose."],["Empathy","Recognises hypoglycaemia under 4.0","15–15 rule: 30 g fast sugar (over 70 kg), retest 15 min, then long-acting snack","Driving: at least 5.0 before driving; wait 1 hour after self-treatment (24 hours if severe)","Do not drive now","Looks for causes: missed meal, dose, exercise","Replace glucagon kit; review with doctor; teach-back"]],
[3,"Voltaren (diclofenac gel) for knee pain","A 62-year-old man asks to buy Voltaren gel for knee pain. You are the pharmacist. Use WWHAM and advise.","62-year-old man. Opening: “I would like some Voltaren for my knees.”",["Other medicines|You take ibuprofen tablets and aspirin.","Blood thinners|You take warfarin.","Joint symptoms|Both knees, worse with walking, stiff 15 minutes in the morning.","Skin and how he will use it|Skin intact; you will wrap with a heat pad."],["WWHAM","Likely OA (activity pain, morning stiffness under 30 min); excludes red flags (hot swollen joint, fever)","Topical NSAID: only 1–10% absorbed, fewer side effects","Apply as directed 3–4 times daily; wash hands","No broken skin, eyes, occlusive dressings or heat","Do not double up with oral NSAIDs; caution with warfarin/aspirin","Non-drug: strengthening exercise, weight loss, footwear","GP if no improvement; teach-back"],"★ Appeared in exam"],
[3,"Paracetamol for knee osteoarthritis","A 70-year-old woman asks for the strongest tablet for knee osteoarthritis. You are the pharmacist. Use WWHAM and advise.","70-year-old woman, 45 kg. Opening: “Which is the strongest painkiller for my knee?”",["Other products|You take cold and flu tablets containing paracetamol.","Alcohol|Two glasses of wine daily.","Weight|You weigh 45 kg."],["WWHAM","Paracetamol first line: 1 g QID or Osteo 665 mg TDS","Avoid double paracetamol (cold and flu products); daily maximum","Lower maximum for low weight, alcohol, liver disease","Topical NSAID or capsaicin; non-drug measures","GP review if not effective; teach-back"]],

D.sort((a,b)=>a[0]-b[0]);
D.forEach(x=>{x[6]=x[6]||(/Alendronate|Empagliflozin|Acute gout|Capsaicin/.test(x[1])?"Practised in class":"")});
let cur=0,hide=false,sec=420,iv=null;const done={};
const $=i=>document.getElementById(i);
$("sel").innerHTML=[1,2,3].map(g=>`<optgroup label="${G[g]}">`+D.map((x,i)=>x[0]==g?`<option value="${i}">${i+1}. ${x[6]?"★ ":""}${x[1]}</option>`:"").join("")+"</optgroup>").join("");
function render(){const x=D[cur];done[cur]=done[cur]||{};$("sel").value=cur;
const items=[...x[5].map((t,i)=>["c"+i,t]),...x[4].map((c,i)=>["h"+i,"Asked about: "+c.split("|")[0]])];
const n=items.filter(i=>done[cur][i[0]]).length;
$("m").innerHTML=`<div class="mu">${G[x[0]]} · ${cur+1}/${D.length}</div><h2>${x[1]}${x[6]?` <span class="tag">${x[6]}</span>`:""}</h2>
<div class="card"><h3>1 · Pharmacist scenario</h3><p style="margin:0">${x[2]}</p></div>
<div class="card"><h3>2 · Patient scenario <button id="hp" style="float:right;font-size:13px;padding:2px 10px">${hide?"Show":"Hide"}</button></h3>
${hide?'<p class="mu" style="margin:0">Hidden.</p>':`<div class="warn">Patient/actor only. Reveal a clue ONLY if the pharmacist asks.</div><p>${x[3]}</p>${x[4].map(c=>{const p=c.split("|");return `<div class="clue"><b>If asked about ${p[0]}:</b><br>${p[1]}</div>`}).join("")}`}</div>
<div class="card"><h3>3 · Marking checklist</h3><div class="score">${n} / ${items.length} (${Math.round(100*n/items.length)}%)</div>
${items.map(i=>`<label><input type="checkbox" data-k="${i[0]}" ${done[cur][i[0]]?"checked":""}><span>${i[1]}</span></label>`).join("")}
<p><button id="clr">Clear marks</button></p></div>
<div class="nav"><button id="pv">← Previous</button><button id="nx">Next →</button></div>`;}
function go(i){cur=(i+D.length)%D.length;rt();render();window.scrollTo(0,0);}
$("sel").onchange=e=>go(+e.target.value);
$("m").onclick=e=>{const t=e.target.id;if(t=="hp"){hide=!hide;render();}if(t=="clr"){done[cur]={};render();}if(t=="pv")go(cur-1);if(t=="nx")go(cur+1);};
$("m").onchange=e=>{if(e.target.dataset.k){done[cur][e.target.dataset.k]=e.target.checked;const y=scrollY;render();scrollTo(0,y);}};
function show(){const t=$("timer");t.textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");t.className=sec<=60?"low":"";}
function rt(){clearInterval(iv);iv=null;sec=420;$("ts").textContent="Start";show();}
$("ts").onclick=()=>{if(iv){clearInterval(iv);iv=null;$("ts").textContent="Resume";return;}$("ts").textContent="Pause";iv=setInterval(()=>{sec--;show();if(sec<=0){clearInterval(iv);iv=null;$("ts").textContent="Start";alert("Time is up!");}},1000);};
$("tr").onclick=rt;
render();show();
</script></body></html>
